name: Build and Publish Docker Image

# Pushes and pull requests only run the tests. Images are built by the nightly run, which
# publishes when the game has a new version or main has commits that are not in an image yet,
# so a day of pushes costs at most one build.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'smoke/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'smoke/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and republish even if the current images are up to date"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh smoke/*.sh ci/*.sh

      - name: Run smoke tests
        run: bash smoke/run_smoke.sh

  prepare:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
      repo_name_lc: ${{ steps.set-matrix.outputs.repo_name_lc }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Decide build matrix
        id: set-matrix
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail
          REPO_NAME_LC="${GITHUB_REPOSITORY,,}"
          REPO_VERSION="${GITHUB_SHA::7}"
          eval "$(bash ci/get_latest_versions.sh)"

          # An image tagged with this game version and commit means nothing changed since the last build.
          needs_build() {
            [ "${FORCE_REBUILD}" = "true" ] \
              || ! docker manifest inspect "ghcr.io/${REPO_NAME_LC}:$1-$2-${REPO_VERSION}" >/dev/null 2>&1
          }

          builds=()
          if needs_build stable "${LATEST_STABLE_VERSION}"; then
            builds+=("stable:${LATEST_STABLE_VERSION}")
          fi
          if [ -n "${LATEST_UNSTABLE_VERSION}" ] && needs_build unstable "${LATEST_UNSTABLE_VERSION}"; then
            builds+=("unstable:${LATEST_UNSTABLE_VERSION}")
          fi

          matrix="$(printf '%s\n' "${builds[@]}" | jq -R -s -c '
            split("\n") | map(select(length > 0) | split(":") | {channel: .[0], version: .[1]}) | {include: .}
          ')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has_builds=$([ "${#builds[@]}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "repo_name_lc=${REPO_NAME_LC}" >> "$GITHUB_OUTPUT"
          echo "Builds: ${builds[*]:-none}"

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.repo_name_lc }}
      LOCAL_IMAGE: pz-server:candidate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SteamCMD downloads fail now and then, so the build is retried.
      - name: Build image
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 5
          command: |
            BRANCH="public"
            [ "${{ matrix.channel }}" = "unstable" ] && BRANCH="unstable"
            docker buildx build \
              --build-arg STEAMAPPBRANCH="${BRANCH}" \
              --build-arg GAME_VERSION="${{ matrix.version }}" \
              --cache-from type=gha,scope=${{ matrix.channel }} \
              --cache-to type=gha,mode=max,scope=${{ matrix.channel }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              --tag "${LOCAL_IMAGE}" \
              --load \
              .

      - name: Boot test
        id: boot
        run: |
          bash ci/boot_test.sh "${LOCAL_IMAGE}" \
            "out/${{ matrix.channel }}-${{ matrix.version }}.json" \
            "${{ matrix.channel }}-${{ matrix.version }}-${GITHUB_SHA::7}"

      # A game update can change the install layout the scripts rely on.
      - name: Show the game install
        if: failure() && steps.boot.outcome == 'failure'
        run: |
          docker run --rm --entrypoint bash "${LOCAL_IMAGE}" -c '
            id; echo "STEAMAPPDIR=${STEAMAPPDIR}"
            ls -la /home/steam "${STEAMAPPDIR}"
            ls -laL "${STEAMAPPDIR}/start-server.sh"
            head -c 300 "${STEAMAPPDIR}/start-server.sh" | od -c | head -n 12'

      - name: Publish image
        run: |
          set -euo pipefail
          for tag in "${{ matrix.channel }}" "${{ matrix.channel }}-${{ matrix.version }}" "${{ matrix.channel }}-${{ matrix.version }}-${GITHUB_SHA::7}"; do
            docker tag "${LOCAL_IMAGE}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done

      - name: Upload env reference
        uses: actions/upload-artifact@v7
        with:
          name: env-${{ matrix.channel }}
          path: out/${{ matrix.channel }}-${{ matrix.version }}.json
          if-no-files-found: error

  pages:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download env references
        uses: actions/download-artifact@v8
        with:
          pattern: env-*
          merge-multiple: true
          path: _site/env

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: bash ci/build_site.sh _site "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
