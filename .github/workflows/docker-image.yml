name: Build and Publish Docker Image

# Pushes and pull requests run the tests, and pushes to main redeploy the docs site. The image holds
# no game: containers install it on start. The nightly run boots the image on the current stable
# game and, while one is open, the beta, whenever the image or the game's Steam build is new to it.
# It publishes the image when main has commits that are not in one yet, and adds an env reference
# per game build to the site.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'smoke/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'smoke/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Test and republish the image even if nothing changed"
        type: boolean
        default: false

# Test runs replace each other; a push never cancels a nightly or manual build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'build' || 'test' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh smoke/*.sh ci/*.sh

      - name: Run smoke tests
        run: bash smoke/run_smoke.sh

  prepare:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Decide what to test
        id: plan
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          publish=false
          if [ "${FORCE_REBUILD}" = "true" ] \
            || ! docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >/dev/null 2>&1; then
            publish=true
          fi

          # A new image is tested on every branch; otherwise a branch is tested when its build is new.
          branches="$(bash ci/game_branches.sh)"
          published="$(curl -fsS "${SITE_URL}/env/index.json" | jq -r '.files[].file' || true)"
          tests=()
          while read -r branch build; do
            if [ "${publish}" = "true" ] || ! grep -qxF "${branch}-${build}.json" <<< "${published}"; then
              tests+=("${branch}")
            fi
          done <<< "${branches}"

          echo "Steam builds: $(paste -sd ' ' <<< "${branches}"); publish: ${publish}; testing: ${tests[*]:-nothing}"
          {
            echo "branches=$(printf '%s\n' "${tests[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "has_tests=$([ "${#tests[@]}" -gt 0 ] && echo true || echo false)"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Boot test on ${{ matrix.branch }}
    needs: prepare
    if: needs.prepare.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    env:
      LOCAL_IMAGE: pz-server:candidate
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --tag "${LOCAL_IMAGE}" \
            --load \
            .

      - name: Boot test
        id: boot
        run: bash ci/boot_test.sh "${LOCAL_IMAGE}" "${{ matrix.branch }}" out

      # A game update can change the install layout the scripts rely on.
      - name: Show the game install
        if: failure() && steps.boot.outcome == 'failure'
        run: |
          docker run --rm -v pz-boot-game:/home/steam/pz-dedicated --entrypoint bash "${LOCAL_IMAGE}" -c '
            id; echo "STEAMAPPDIR=${STEAMAPPDIR}"
            ls -la /home/steam "${STEAMAPPDIR}" "${STEAMAPPDIR}/steamapps"
            ls -laL "${STEAMAPPDIR}/start-server.sh"
            head -c 300 "${STEAMAPPDIR}/start-server.sh" | od -c | head -n 12'

      - name: Publish image
        if: needs.prepare.outputs.publish == 'true' && matrix.branch == 'public'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in latest "${GITHUB_SHA::7}"; do
            docker tag "${LOCAL_IMAGE}" "${image}:${tag}"
            docker push "${image}:${tag}"
          done

      - name: Upload env reference
        uses: actions/upload-artifact@v7
        with:
          name: env-${{ matrix.branch }}
          path: out/*.json
          if-no-files-found: error

  # References only exist for boot tests that passed, so a failed branch leaves the site as it was.
  pages:
    needs: [test, prepare, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.test.result == 'success'
      && (github.event_name == 'push' || (needs.prepare.outputs.has_tests == 'true' && needs.build.result != 'cancelled'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download env references
        uses: actions/download-artifact@v8
        with:
          pattern: env-*
          merge-multiple: true
          path: _site/env

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: bash ci/build_site.sh _site "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
