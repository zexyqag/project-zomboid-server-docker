name: Clean up old images and deployments

# One-off cleanup after the switch to installing the game at startup. Deletes every image version
# that isn't tagged latest or with a commit (7 hex characters) and isn't part of one that is, and
# every github-pages deployment older than the one the site is served from.
# Without "delete" it only lists what it would delete.
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Delete the listed versions and deployments (otherwise only list them)"
        type: boolean
        default: false

jobs:
  clean-up:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      deployments: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DELETE: ${{ inputs.delete }}
    steps:
      - name: Image versions
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
          versions="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          gh api --paginate "${versions}?per_page=100" \
            --jq '.[] | [.id, .name, (.metadata.container.tags | join(","))] | @tsv' > versions.tsv

          # A multi-platform image is an index whose platform manifests are untagged versions.
          kept=""
          while IFS=$'\t' read -r _ digest tags; do
            if grep -qE '(^|,)(latest|[0-9a-f]{7})(,|$)' <<< "${tags}"; then
              kept+="${digest}"$'\n'
              kept+="$(docker buildx imagetools inspect --raw "${image}@${digest}" | jq -r '.manifests[]?.digest')"$'\n'
            fi
          done < versions.tsv

          deleted=0
          while IFS=$'\t' read -r id digest tags; do
            if grep -qxF "${digest}" <<< "${kept}"; then
              echo "keep    ${digest} ${tags}"
            else
              echo "delete  ${digest} ${tags:-(untagged)}"
              deleted=$((deleted + 1))
              if [ "${DELETE}" = "true" ]; then
                gh api -X DELETE "${versions}/${id}" > /dev/null
              fi
            fi
          done < versions.tsv
          echo "$(wc -l < versions.tsv) image versions, ${deleted} $([ "${DELETE}" = "true" ] && echo deleted || echo "to delete")"

      - name: Pages deployments
        run: |
          set -euo pipefail
          deployments="/repos/${GITHUB_REPOSITORY}/deployments"
          # Newest first. The site is served from the newest successful one; older ones are inactive.
          gh api --paginate "${deployments}?environment=github-pages&per_page=100" \
            --jq '.[] | [.id, .ref, .sha[0:7], .created_at] | @tsv' > deployments.tsv

          live="" deleted=0
          while IFS=$'\t' read -r id ref sha created; do
            state="$(gh api "${deployments}/${id}/statuses?per_page=1" --jq '.[0].state // "none"')"
            if [ -z "${live}" ]; then
              echo "keep    ${created} ${ref} ${sha} ${state}"
              [ "${state}" = success ] && live="${id}"
              continue
            fi
            echo "delete  ${created} ${ref} ${sha} ${state}"
            deleted=$((deleted + 1))
            if [ "${DELETE}" = "true" ]; then
              # Only inactive deployments can be deleted.
              gh api -X POST "${deployments}/${id}/statuses" -f state=inactive > /dev/null
              gh api -X DELETE "${deployments}/${id}" > /dev/null
            fi
          done < deployments.tsv
          [ -n "${live}" ] || { echo "Error: no successful github-pages deployment found, nothing deleted" >&2; exit 1; }
          echo "$(wc -l < deployments.tsv) deployments, ${deleted} $([ "${DELETE}" = "true" ] && echo deleted || echo "to delete")"
