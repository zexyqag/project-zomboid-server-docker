<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Zomboid server env vars</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e2dc;
      --accent: #2f6f4e; --code-bg: #f0f0ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161714; --panel: #1f201c; --text: #e8e8e2; --muted: #9a9a92; --border: #33352f;
        --accent: #7fc39b; --code-bg: #2a2c26;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; }
    input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
    input { flex: 1 1 260px; min-width: 0; }
    .count { color: var(--muted); align-self: center; font-size: 0.9rem; }
    section { margin-bottom: 28px; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .row { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; }
    .name { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; cursor: copy; }
    .desc { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
    .empty, .error { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Project Zomboid server env vars</h1>
  <p class="lead">
    Every variable the <code>ghcr.io/zexyqag/project-zomboid-server-docker</code> image reads, listed from a freshly started server.
    Mods add more settings; <code>docker exec &lt;container&gt; list-env</code> lists them for your own server. Click a name to copy it.
  </p>
  <div class="controls">
    <select id="version" aria-label="Image version"></select>
    <input id="search" type="search" placeholder="Search names and descriptions" aria-label="Search">
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</main>
<script>
  const kinds = [
    ['image', 'Image settings'],
    ['ini', 'Server settings (pzserver.ini)'],
    ['sandbox', 'Sandbox settings (pzserver_SandboxVars.lua)'],
  ];
  const versionSelect = document.getElementById('version');
  const search = document.getElementById('search');
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  let vars = [];

  function render() {
    const query = search.value.trim().toLowerCase();
    const shown = vars.filter(v => !query || (v.name + ' ' + v.description).toLowerCase().includes(query));
    count.textContent = `${shown.length} of ${vars.length}`;
    list.replaceChildren();
    for (const [kind, title] of kinds) {
      const rows = shown.filter(v => v.kind === kind);
      if (!rows.length) continue;
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.textContent = title;
      section.append(heading);
      for (const v of rows) {
        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = v.name;
        name.title = 'Copy';
        name.addEventListener('click', () => navigator.clipboard?.writeText(v.name));
        row.append(name);
        if (v.description) {
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = v.description;
          row.append(desc);
        }
        section.append(row);
      }
      list.append(section);
    }
    if (!shown.length) list.innerHTML = '<p class="empty">Nothing matches.</p>';
  }

  async function loadVersion(file) {
    list.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const response = await fetch(`env/${file}`, { cache: 'no-store' });
      vars = (await response.json()).vars;
      render();
    } catch (error) {
      list.innerHTML = '<p class="error">Could not load this version.</p>';
    }
  }

  async function init() {
    try {
      const response = await fetch('env/index.json', { cache: 'no-store' });
      const files = (await response.json()).files;
      files.sort((a, b) => b.file.localeCompare(a.file, undefined, { numeric: true }));
      for (const f of files) versionSelect.add(new Option(f.image_tag || f.file, f.file));
      const params = new URLSearchParams(location.search);
      const wanted = files.find(f => f.file === params.get('version'))
        || files.find(f => f.file.startsWith('stable-')) || files[0];
      if (!wanted) {
        list.innerHTML = '<p class="empty">No versions published yet.</p>';
        return;
      }
      versionSelect.value = wanted.file;
      search.value = params.get('q') || '';
      loadVersion(wanted.file);
    } catch (error) {
      list.innerHTML = '<p class="error">Could not load the version list.</p>';
    }
  }

  versionSelect.addEventListener('change', () => loadVersion(versionSelect.value));
  search.addEventListener('input', render);
  init();
</script>
</body>
</html>
